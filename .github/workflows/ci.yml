name: CI

# Gate every push and PR on the same commands the deploy runs, so a broken
# build is caught here rather than by Vercel/Firebase.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck · lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # No secrets are needed: the Firebase client falls back to placeholders
      # when NEXT_PUBLIC_* is absent, so the build is a pure compile check.
      - run: npm run build

  functions:
    name: Cloud Functions (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - run: npm ci

      - run: npm run build

  secret-scan:
    name: No secrets in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap backstop for the .gitignore rules: a committed .env or a pasted
      # service-account key should fail the build, not reach production.
      - name: Fail if a real .env or private key is tracked
        run: |
          set -e
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked env file(s) containing secrets:"; echo "$bad"; exit 1
          fi
          # Exclude this workflow — it contains the patterns it searches for.
          if git grep -I -l -F -e 'BEGIN PRIVATE KEY' -e '"type": "service_account"' \
               -- . ':!.github/workflows/ci.yml' ; then
            echo "::error::Service-account credentials found in tracked files"; exit 1
          fi
          echo "OK — no tracked secrets."
